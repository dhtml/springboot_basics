# ============================================================
# APPLICATION CONFIGURATION
# ============================================================
spring.application.name=spring-boot-api-tutorial

# The port the server listens on. Change this if 8080 is taken.
server.port=8080

# ============================================================
# H2 IN-MEMORY DATABASE CONFIGURATION
#
# The H2 database lives entirely in memory.
# It is created fresh on every startup and destroyed on shutdown.
# This means data DOES NOT persist between restarts (by design, for learning).
# ============================================================
spring.datasource.url=jdbc:h2:mem:tutorialdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ============================================================
# H2 CONSOLE - Web UI to browse the database
#
# After starting the app, open: http://localhost:8080/h2-console
# On the login page, use these settings:
#   JDBC URL:  jdbc:h2:mem:tutorialdb
#   Username:  sa
#   Password:  (leave blank)
# ============================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ============================================================
# JPA / HIBERNATE CONFIGURATION
# ============================================================

# create-drop: Hibernate creates tables on startup, drops them on shutdown.
# Other options:
#   update     - Alters existing tables to match entities (useful for development)
#   validate   - Validates schema matches entities but makes no changes (for production)
#   none       - Does nothing (you manage schema manually)
spring.jpa.hibernate.ddl-auto=create-drop

# Show the SQL statements Hibernate executes (great for learning!)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2-specific dialect (tells Hibernate which SQL flavor to generate)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# IMPORTANT: With Spring Boot 3.x, when using both Hibernate DDL (ddl-auto)
# AND a data.sql file, you MUST set this to true.
# It tells Spring to defer SQL script execution until AFTER Hibernate
# has created the tables. Without this, data.sql runs before the tables exist!
spring.jpa.defer-datasource-initialization=true

# Run data.sql on every startup to populate initial data
spring.sql.init.mode=always

# ============================================================
# SPRINGDOC / SWAGGER UI
#
# Interactive API documentation is available at:
#   http://localhost:8080/swagger-ui.html
#   http://localhost:8080/v3/api-docs  (raw JSON schema)
# ============================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ============================================================
# LOGGING
# ============================================================
# Shows which Spring beans are created (useful while learning)
logging.level.org.springframework.web=INFO
logging.level.com.tutorial.api=DEBUG
